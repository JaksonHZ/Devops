apiVersion: apps/v1
kind: Deployment
metadata:
  name: tasker-db
  labels:
    app: tasker-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tasker-db
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: tasker-db
    spec:
      containers:
        - name: tasker-db
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: tasker-db-secret
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tasker-db-pvc
