apiVersion: apps/v1
kind: Deployment
metadata:
  name: tasker-frontend
  labels:
    app: tasker-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tasker-frontend
  template:
    metadata:
      labels:
        app: tasker-frontend
    spec:
      containers:
        - name: tasker-frontend
          image: jaksonhz/tasker-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: tasker-frontend-config
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
