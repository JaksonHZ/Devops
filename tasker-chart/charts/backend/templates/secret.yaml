apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.global.backend.name }}-secret
  labels:
    app: {{ .Values.global.backend.name }}
type: Opaque
data:
  POSTGRES_USER: {{ .Values.global.db.user | b64enc }}
  POSTGRES_PASSWORD: {{ .Values.global.db.password | b64enc }}
  SECRET_JWT: {{ .Values.global.backend.jwtSecret | b64enc }}
